name: Photo Manager
version: "0.2.0"
slug: photo_manager
description: Finds the Canon CR2 photos on your NAS, reports what you have (including exact duplicates), can develop them to JPEGs overnight with darktable (off until you turn it on), and lets you move duplicate copies to a quarantine folder after a checksum check.
url: https://github.com/sjeapes/media_grabber/tree/main/photo_manager
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:image-multiple
panel_title: Photo Manager
homeassistant_api: true
map:
  - media:rw
  - share:rw
  - addon_config:rw
options:
  low_space_gb: 20
  develop_start_hour: 1
  develop_end_hour: 6
  develop_min_free_gb: 5
  jpeg_quality: 92
schema:
  low_space_gb: int(1,100000)
  develop_start_hour: int(0,23)
  develop_end_hour: int(0,23)
  develop_min_free_gb: int(1,100000)
  jpeg_quality: int(50,100)
